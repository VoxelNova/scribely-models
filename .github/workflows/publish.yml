name: Publish models

# Mirrors the speech models used by Scribely into a GitHub release of this public repo,
# so the app downloads them from VoxelNova's own GitHub instead of third-party links.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/publish.yml", "licenses/**"]

permissions:
  contents: write

env:
  TAG: models-v1

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download models
        run: |
          set -e
          mkdir dist
          HF=https://huggingface.co/csukuangfj
          while read -r name url; do
            echo "Downloading $name"
            curl -fL --retry 5 --retry-delay 5 -o "dist/$name" "$url"
          done <<LIST
          tiny-encoder.int8.onnx $HF/sherpa-onnx-whisper-tiny/resolve/main/tiny-encoder.int8.onnx
          tiny-decoder.int8.onnx $HF/sherpa-onnx-whisper-tiny/resolve/main/tiny-decoder.int8.onnx
          tiny-tokens.txt $HF/sherpa-onnx-whisper-tiny/resolve/main/tiny-tokens.txt
          base-encoder.int8.onnx $HF/sherpa-onnx-whisper-base/resolve/main/base-encoder.int8.onnx
          base-decoder.int8.onnx $HF/sherpa-onnx-whisper-base/resolve/main/base-decoder.int8.onnx
          base-tokens.txt $HF/sherpa-onnx-whisper-base/resolve/main/base-tokens.txt
          silero_vad.onnx https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
          LIST
          cp licenses/* dist/
          cd dist
          sha256sum *.onnx *.txt > SHA256SUMS
          cat SHA256SUMS
          # One annotation with name, size and hash of every model file (read by the app build)
          echo "::notice title=Models::$(for f in *.onnx *-tokens.txt; do echo -n "$f $(stat -c%s "$f") $(sha256sum "$f" | cut -d' ' -f1); "; done)"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Speech models for Scribely (offline voice to text). Whisper tiny/base int8 (OpenAI, MIT) exported for sherpa-onnx (k2-fsa, Apache-2.0) and Silero VAD (MIT). See LICENSE files and SHA256SUMS."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Scribely models v1" --notes "$NOTES"
          fi
          gh release view "$TAG" --json assets -q '.assets[] | "\(.name) \(.size)"'
